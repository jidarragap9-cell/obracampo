<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actualizar ObraCampo</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1f3a5f; color: #fff; font: 18px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  p { max-width: 420px; }
</style>
</head>
<body>
<p id="msg">Actualizando ObraCampo…<br><small>Sus proyectos, bitácoras y planos no se borran.</small></p>
<script>
  /* Borra solo la copia de la app (caché y service worker). Los datos en IndexedDB quedan intactos. */
  (async () => {
    try {
      if ('caches' in window) for (const k of await caches.keys()) await caches.delete(k);
      if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
      // Refresca también la caché HTTP del navegador, que puede guardar archivos viejos unos minutos
      const archivos = ['index.html', 'sw.js', 'manifest.webmanifest', 'css/app.css', ...['db', 'ui', 'calc', 'bitacora', 'report', 'precios',
        'presupuesto', 'elementos', 'vendor/three.min', 'iso', 'plano', 'contencion', 'banco', 'app'].map(n => `js/${n}.js`)];
      await Promise.allSettled(archivos.map(a => fetch(a, { cache: 'reload' })));
      location.replace('./index.html?act=' + Date.now());
    } catch (err) {
      document.getElementById('msg').textContent = 'No se pudo actualizar: ' + err.message;
    }
  })();
</script>
</body>
</html>
